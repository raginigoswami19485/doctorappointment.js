<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signup & Book Test Data Bar Graph</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .section {
      margin-bottom: 50px;
    }
    .bar-container {
      width: 100%;
    }
    .label {
      font-weight: bold;
      margin-bottom: 5px;
    }
    .bar {
      height: 30px;
      background-color: #007BFF;
      margin: 8px 0 20px 0;
      color: white;
      text-align: right;
      padding-right: 10px;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    .bar:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="section" id="signupSection">
    <h2>Signup Users Data</h2>
    <div class="bar-container" id="signupGraph"></div>
  </div>

  <div class="section" id="bookTestSection">
    <h2>Book Test Data</h2>
    <div class="bar-container" id="bookTestGraph"></div>
  </div>

  <script>
    // -- Signup Data from localStorage --
    // For example, you can store multiple user signups as JSON array in localStorage
    // Here we fake example data; replace this with real localStorage logic if needed

    // Example: localStorage.setItem("users", JSON.stringify([{name:"Ragini",email:"r@e.com"}, {name:"Amit",email:"a@e.com"}]))
    // So number of users = length of that array

    // Let's simulate 5 users signed up:
    const users = JSON.parse(localStorage.getItem("users")) || [
      {name:"Ragini", email:"ragini@example.com"},
      {name:"Amit", email:"amit@example.com"},
      {name:"Sita", email:"sita@example.com"},
      {name:"Raj", email:"raj@example.com"},
      {name:"Neha", email:"neha@example.com"}
    ];

    // Prepare signup graph data (for example, total users)
    const signupData = [
      {label: "Total Signup Users", value: users.length}
      // aap yahan aur data add kar sakte ho, jaise successful passwords, emails, etc.
    ];

    // -- Book Test Data --
    // Example dummy data for booked tests, aap apne app se data fetch kar sakte hain
    const bookTestData = [
      {label: "Blood Tests Booked", value: 8},
      {label: "COVID Tests Booked", value: 5},
      {label: "X-Ray Tests Booked", value: 3},
      {label: "MRI Tests Booked", value: 2}
    ];

    // Function to render bar graph
    function renderBarGraph(containerId, data) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";  // clear previous graph

      data.forEach(item => {
        const label = document.createElement("div");
        label.className = "label";
        label.innerText = item.label;
        container.appendChild(label);

        const bar = document.createElement("div");
        bar.className = "bar";
        // width proportional to value * 30 (adjust as needed)
        bar.style.width = (item.value * 30) + "px";
        bar.innerText = item.value;
        container.appendChild(bar);
      });
    }

    // Call render for signup data and book test data
    renderBarGraph("signupGraph", signupData);
    renderBarGraph("bookTestGraph", bookTestData);

  </script>

</body>
</html>
