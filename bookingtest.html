<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', sans-serif;
  background-color: #f0f4f8;
  box-sizing: border-box;
}

.container {
  display: flex;
  height: 100vh;
  /* width: auto; */
  /* background-color: #357ae8; */
  overflow: hidden;
}

.left-side {
 
  display: flex;
  justify-content: center;
  align-items: center;
}



.right-side {
  /* flex: 0.7; */
  /* padding: 40px; */
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%; 
  width: 100%;
  position: relative; 
}


form {
    width: 70%;
    height: 420px;
  /* border-radius: 10px; */
margin-bottom: 10%; 
padding-left: 14%;

}

form label {
  display: block;
  margin-bottom: 4px;
  font-size: 14px;
  color: #333;
}

form input[type="text"],
form input[type="number"],
form input[type="date"],
form input[type="email"],
form textarea {
  width: 80%;
  padding: 10px 10px;
  margin-bottom: 10px;
  font-size: 11px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background-color: #e6f0ff;
}

form textarea {
  height: 70px;
  /* resize: vertical; */
}

form input[type="radio"] {
  margin-right: 6px;
  transform: scale(1);
}

form button {
  width: 80%;
  padding: 10px;
  font-size: 14px;
  background-color: #4a90e2;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

form button:hover {
  background-color: #357ae8;
}
#symptoms{
    width: 50%;
    height: 20px;
}

/* recipt */
/* Optional container styling */
.container {
  display: flex;
  gap: 20px;
}

.left-side img {
  max-width: 100%;
  height: auto;
}

.right-side {
  flex: 1;
}

/* Modal Styles */
.receipt-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(240, 240, 240, 0.6);
  backdrop-filter: blur(5px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.receipt-box {
  background: #79d9f9;
  padding: 30px; 
  width: 70%;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 0 10px #888;
}

.receipt-box button {
  margin-top: 15px;
  padding: 8px 16px;
  background: #cc7000;
  color: rgb(255, 255, 255);
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

p{
  font-size: 20px;
}



    </style>
</head>
<body>
    <div class="container">
      <div class="left-side">
        <img src="https://img.freepik.com/free-photo/beautiful-young-female-doctor-looking-camera-office_1301-7807.jpg">
      </div>
      <div data-aos="flip-right" id="vanta-bg" class="right-side">
        <form id="appointmentForm">
          <label for="name">Name:</label>
          <input type="text" id="name" required>
    
          <label for="place">Place:</label>
          <input type="text" id="place" required>
    
          <label for="symptoms">Symptoms:</label>
          <textarea id="symptoms" required></textarea>
    
          <label for="date">Date:</label>
          <input type="date" id="date" required>
    
          <label for="age">Age:</label>
          <input type="number" id="age" min="0" required>
    
          <label>Gender:</label>
          <input type="radio" id="male" name="gender" value="Male" required>
          <label for="male">Male</label>
          <input type="radio" id="female" name="gender" value="Female">
          <label for="female">Female</label>
          <input type="radio" id="other" name="gender" value="Other">
          <label for="other">Other</label>
    
          <br>
          <button type="submit">Book Appointment</button>
        </form>
      </div>
    </div>
    
    <!-- Receipt Modal -->
    <div class="receipt-modal" id="receiptModal">
      <div class="receipt-box">
        <h2>Booking Confirmed</h2>
        <p><strong>Name:</strong> <span id="r-name"></span></p>
        <p><strong>Place:</strong> <span id="r-place"></span></p>
        <p><strong>Symptoms:</strong> <span id="r-symptoms"></span></p>
        <p><strong>Date:</strong> <span id="r-date"></span></p>
        <p><strong>Age:</strong> <span id="r-age"></span></p>
        <p><strong>Gender:</strong> <span id="r-gender"></span></p>
        <button onclick="closeReceipt()">Close</button>
      </div>
    </div>
    
      
</body>


<script src="booking.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.cells.min.js"></script>
<script>
  AOS.init();

  VANTA.CLOUDS({
    el: "#vanta-bg",
    mouseControls: true,
    touchControls: true,
    gyroControls: false,
    minHeight: 600.00,
    minWidth: 600.00
  });

  AOS.init();

  VANTA.CELLS({
  el: "#receiptModal",
  mouseControls: true,
  touchControls: true,
  gyroControls: false,
  minHeight: 200.00,
  minWidth: 200.00,
  scale: 1.00,
  color1: 0x32dcdc,
  color2: 0x35e6f2,
  size: 1.30,
  speed: 3.30
})

</script>

</html>
